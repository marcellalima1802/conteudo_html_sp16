<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <Title>Conteudo Aula10 - HTML</Title>
    </head>
    <body>
        
        <h1>Listas no HTML</h1>

        <h3>Exemplo de lista Não Ordenada no HTML</h3>

        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
            <li>Item 4</li>
            <li>Item 5</li>
        </ul>

        <hr>

        <h3>Exemplo de lista Ordenada</h3>

        <ol>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
            <li>Item 4</li>
            <li>Item 5</li>
        </ol>

        <h3>Exemplo de lista Descritiva no HTML</h3>

        <dl>
            <dt>Carro</dt>
            <dd>Possui 4 rodas.</dd>
            <dt>Moto</dt>
            <dd>Veiculo que Possui 2 rodas.</dd>

        </dl>




    </body>
</html>
