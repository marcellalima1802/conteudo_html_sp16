<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteudo Aula05 - HTML</title>
    </head>
    <body>

        <h1>Utilizando o atributo style para definir estilos em elementos no HTML:</h1>

<P style="color: orangered;">Eu sou laranja</P>

<P style="color: brown;">Eu sou marrom</P>

<P style="font-size: 30px; font-weight: bold;">Eu estou destacado</P>

<h3>Definindo cores de fundo com o atributo style no fundo</h3>

<h2 style="background-color: rgb(73, 180, 100);">Eu sou um h2</h2>
<p style="background-color: blueviolet;">Eu sou um parágrafo</p>

    </body>
</html>
