<!DOCTYPE html>
<html lang="pt-br">
    <head> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Conteúdo Aula16 - HTML</title>
        </head>
        <body>

            <h1>Formulário no HTML</h1>

            <form>
                <label for="pnome">Primeiro nome:</label><br>
                <input type="text" name="pnome" id="pnome">
                <label for="snome">Segundo nome:</label>
                <input type="text" name="snome" id="snome"><br>
                <input type="button" value="Enviar">
            </form>

            <hr>

            <h3>Inputs tipo Radio</h3>

            <form>
                <input type="radio" name="linguagem-favorita" id="op-html" value="HTML">
                <label for="op-html">HTML</label>
                <br>
                <input type="radio" name="linguagem-favorita" id="op-css" value="CSS">
                <label for="op-css">CSS</label>
                <br>
                <input type="radio" name="linguagem-favorita" id="op-js" value="JavaScript">
                <label for="op-js">JavaScript</label>
            </form>

            <hr>

            <h3>Inputs tipo checkbox</h3>

            <form>
                <input type="checkbox" name="frutas1" id="f-morango" value="Moranfo">
                <label for="f-morango">Morango</label>
                <br>

                <input type="checkbox" name="fruta2" id="f-laranja" value="Laranja">
                <label for="f-laranja">Laranja</label>
                <br>

                <input type="checkbox" name="fruta3" id="f-maracuja" value="Maracujá">
                <label for="f-maracuja">Maracujá</label>
                <br>
            </form>




        </body>
</html>
